<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>考公词汇 · 每日记忆</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">📖 我的生词本</div>
    <div class="top-actions">
      <button class="icon-btn" id="btnStat" title="统计">📊</button>
      <button class="icon-btn" id="btnAdd" title="添加生词">➕</button>
      <button class="icon-btn" id="btnSettings" title="设置">⚙️</button>
    </div>
  </header>

  <!-- 今日摘要卡 -->
  <div class="summary" id="summary">
    <div class="sum-cell">
      <div class="num" id="sNew">0</div>
      <div class="lbl">今日新词</div>
    </div>
    <div class="sum-cell">
      <div class="num" id="sDue">0</div>
      <div class="lbl">待复习</div>
    </div>
    <div class="sum-cell">
      <div class="num" id="sMastered">0</div>
      <div class="lbl">已掌握</div>
    </div>
    <div class="sum-cell">
      <div class="num" id="sTotal">0</div>
      <div class="lbl">总词汇</div>
    </div>
  </div>

  <!-- 主操作按钮 -->
  <div class="actions">
    <button class="main-btn primary" id="btnStudy">🎯 开始今日学习</button>
    <button class="main-btn" id="btnReview">🔁 复习</button>
    <button class="main-btn ghost" id="btnLibrary">📚 全部词库</button>
  </div>

  <!-- 词库搜索 -->
  <div class="searchbar">
    <input id="searchInput" type="text" placeholder="🔍 搜索我收录的词语…">
  </div>

  <!-- 视图容器 -->
  <div id="view" class="view"></div>
</div>

<!-- 卡片学习/复习覆盖层 -->
<div id="overlay" class="overlay hidden">
  <div class="card-scene">
    <div class="card-progress">
      <span id="cardLabel">今日新词</span>
      <span id="cardPosition">1 / 20</span>
    </div>
    <!-- 翻转卡片 -->
    <div class="flip-card" id="flipCard">
      <div class="flip-inner">
        <div class="flip-face front" id="cardFront"></div>
        <div class="flip-face back" id="cardBack"></div>
      </div>
    </div>
    <div class="card-hint" id="cardHint">点卡片翻转查看答案</div>
    <!-- 自评按钮 -->
    <div class="grade-row hidden" id="gradeRow">
      <button class="grade bad" data-grade="0">很陌生</button>
      <button class="grade hard" data-grade="1">有点难</button>
      <button class="grade good" data-grade="2">记住了</button>
      <button class="grade easy" data-grade="3">很简单</button>
    </div>
  </div>
</div>

<!-- 底部提示 -->
<div id="toast" class="toast hidden"></div>

<!-- 弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-box" id="modalBody"></div>
</div>

<script src="app.js?v=7"></script>
</body>
</html>
