<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f6df5">
<title>考公词汇 · 每日记忆</title>
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div id="app">
  <!-- 顶部标题 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">📖</span>
      <span class="brand-text">我的生词本</span>
    </div>
    <button class="icon-btn add-fab" id="btnAdd" title="添加生词">＋</button>
  </header>

  <!-- 今日主卡片（渐变 header） -->
  <section class="today-card" id="todayCard">
    <div class="today-top">
      <div class="today-label">今日学习</div>
      <div class="today-date" id="todayDate"></div>
    </div>
    <div class="today-main">
      <div class="today-numbers">
        <div class="today-num-block">
          <div class="today-num" id="sNew">0</div>
          <div class="today-numlbl">待学新词</div>
        </div>
        <div class="today-divider"></div>
        <div class="today-num-block">
          <div class="today-num" id="sDue">0</div>
          <div class="today-numlbl">待复习</div>
        </div>
        <div class="today-divider"></div>
        <div class="today-num-block">
          <div class="today-num" id="sMastered">0</div>
          <div class="today-numlbl">已掌握</div>
        </div>
      </div>
      <button class="study-btn" id="btnStudy">
        <span class="study-btn-icon">🎯</span>
        <span class="study-btn-text" id="studyBtnText">开始今日学习</span>
      </button>
    </div>
    <div class="today-stats-row">
      <div class="today-stat-item">
        <span>总词汇</span><b id="sTotal">0</b>
      </div>
      <div class="today-stat-item">
        <span>学习进度</span><b><span id="pctText">0%</span></b>
      </div>
    </div>
  </section>

  <!-- Tab 内容区 -->
  <main class="tab-content">
    <!-- 今日 tab -->
    <div class="tab-panel active" id="tab-today">
      <div id="view"></div>
    </div>
    <!-- 词库 tab -->
    <div class="tab-panel" id="tab-library">
      <div class="lib-header">
        <input id="searchInput" type="text" placeholder="🔍 搜索词语 / 释义 / 例句…">
        <div class="filter-row" id="filterRow"></div>
      </div>
      <div id="libView" class="view"></div>
    </div>
    <!-- 统计 tab -->
    <div class="tab-panel" id="tab-stats">
      <div id="statsView"></div>
    </div>
    <!-- 设置 tab -->
    <div class="tab-panel" id="tab-settings">
      <div id="settingsView"></div>
    </div>
  </main>

  <!-- 底部导航 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab-btn active" data-tab="today"><span class="ti">🏠</span><span class="tl">今日</span></button>
    <button class="tab-btn" data-tab="library"><span class="ti">📚</span><span class="tl">词库</span></button>
    <button class="tab-btn" data-tab="stats"><span class="ti">📊</span><span class="tl">统计</span></button>
    <button class="tab-btn" data-tab="settings"><span class="ti">⚙️</span><span class="tl">设置</span></button>
  </nav>
</div>

<!-- 卡片学习覆盖层 -->
<div id="overlay" class="overlay hidden">
  <div class="card-scene">
    <div class="card-progress">
      <span id="cardLabel">今日新词</span>
      <span class="prog-label" id="cardPosition">1 / 20</span>
    </div>
    <div class="flip-card" id="flipCard">
      <div class="flip-inner">
        <div class="flip-face front" id="cardFront"></div>
        <div class="flip-face back" id="cardBack"></div>
      </div>
    </div>
    <div class="card-hint" id="cardHint">点卡片翻转查看答案</div>
    <div class="grade-row hidden" id="gradeRow">
      <button class="grade bad" data-grade="0">很陌生</button>
      <button class="grade hard" data-grade="1">有点难</button>
      <button class="grade good" data-grade="2">记住了</button>
      <button class="grade easy" data-grade="3">很简单</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBody"></div></div>

<script src="app.js?v=10"></script>
</body>
</html>
