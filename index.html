<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的生词本</title>
<link rel="stylesheet" href="style.css?v=61">
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">📖 我的生词本</div>
    <div class="top-actions">
      <button class="icon-btn" id="btnSettings" title="设置">⚙️</button>
      <button class="icon-btn add" id="btnAdd" title="添加生词">＋</button>
    </div>
  </header>

  <!-- 今日摘要卡 -->
  <div class="summary" id="summary">
    <div class="sum-cell"><div class="num" id="sNew">0</div><div class="lbl">今日新词</div></div>
    <div class="sum-cell"><div class="num" id="sDue">0</div><div class="lbl">待复习</div></div>
    <div class="sum-cell clickable" id="masteredCell" data-stat="mastered"><div class="num" id="sMastered">0</div><div class="lbl">已掌握 ›</div></div>
    <div class="sum-cell clickable" id="totalCell" data-goto="library"><div class="num" id="sTotal">0</div><div class="lbl">总词汇 ›</div></div>
  </div>

  <!-- 主操作按钮 -->
  <div class="actions">
    <button class="main-btn primary" id="btnStudy">🎯 开始今日学习</button>
    <button class="main-btn" id="btnReview">🔁 复习</button>
    <button class="main-btn ghost" id="btnLibrary">📚 全部词库</button>
    <button class="main-btn ai-query-btn" id="btnAiLookupHome">🤖 AI 查词</button>
  </div>

  <!-- 词库搜索 -->
  <div class="searchbar">
    <input id="searchInput" type="text" placeholder="🔍 搜索我的词语…">
  </div>

  <!-- 视图容器 -->
  <div id="view" class="view"></div>
</div>

<!-- 学习覆盖层 -->
<div id="overlay" class="overlay hidden">
  <div class="card-scene">
    <div class="card-progress">
      <span id="cardLabel">今日新词</span>
      <span class="prog-label" id="cardPosition">1 / 20</span>
      <button class="study-exit" id="studyExit" title="退出学习">✕</button>
    </div>
    <div class="flip-card" id="flipCard">
      <div class="flip-inner">
        <!-- 正面：词 + 输入理解 -->
        <div class="flip-face front" id="cardFront">
          <div class="front-body">
            <div class="flip-word" id="frontWord"></div>
            <div class="front-inputs">
              <label>你的理解 <span class="inp-hint">（词义、侧重一起写，意思对就行）</span></label>
              <textarea id="sMeaning" rows="3" placeholder="你理解的词义和适用语境…"></textarea>
              <label>感情色彩</label>
              <input id="sTone" placeholder="你判断它的感情色彩…">
            </div>
            <button class="ai-submit-btn" id="btnAiSubmit">🤖 提交 AI 判定</button>
          </div>
        </div>
        <!-- 背面：AI 评价 + 完整释义 + 自评 -->
        <div class="flip-face back" id="cardBack">
          <div class="back-body">
            <div class="ai-verdict" id="aiVerdict">
              <div class="ai-label">🤖 AI 评价</div>
              <div class="ai-text" id="aiText"></div>
            </div>
            <div class="back-word" id="backWord"></div>
            <div class="back-content" id="backContent"></div>
            <div class="grade-row self-grade" id="gradeRow">
              <button class="grade bad" data-grade="0">很陌生</button>
              <button class="grade hard" data-grade="1">有点难</button>
              <button class="grade good" data-grade="2">记住了</button>
              <button class="grade easy" data-grade="3">很简单</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 编辑器 -->
<div id="editor" class="modal fullscreen hidden">
  <div class="editor-sheet">
    <div class="editor-head">
      <span class="editor-title" id="editorTitle">记录生词</span>
      <span class="ai-lookup-btn" id="btnAiLookup">🤖 AI 查词</span>
      <button class="editor-close" data-close>✕</button>
    </div>
    <div class="editor-body">
      <div class="editor-field"><label>词语 / 成语</label><input id="eWord" autocomplete="off"><div class="dup-hint hidden" id="eDupHint"></div></div>
      <div class="editor-field">
        <div class="field-head"><label>释义</label><span class="md-toggle" id="eMeaningToggle">👁 实时预览</span></div>
        <textarea id="eMeaning" rows="3" class="auto-grow"></textarea>
        <div class="md-preview hidden" id="eMeaningPreview"></div>
      </div>
      <div class="editor-field">
        <div class="field-head"><label>侧重</label><span class="md-toggle" id="eFocusToggle">👁 实时预览</span></div>
        <textarea id="eFocus" rows="3" class="auto-grow"></textarea>
        <div class="md-preview hidden" id="eFocusPreview"></div>
      </div>
      <div class="editor-field">
        <div class="field-head"><label>感情色彩</label></div>
        <input id="eTone">
      </div>
      <div class="editor-field">
        <div class="field-head"><label>常见搭配</label><span class="md-toggle" id="eCollocationToggle">👁 实时预览</span></div>
        <textarea id="eCollocation" rows="3" class="auto-grow"></textarea>
        <div class="md-preview hidden" id="eCollocationPreview"></div>
      </div>
      <div class="editor-field">
        <div class="field-head"><label>易错易混</label><span class="md-toggle" id="eMisconstrueToggle">👁 实时预览</span></div>
        <textarea id="eMisconstrue" rows="3" class="auto-grow"></textarea>
        <div class="md-preview hidden" id="eMisconstruePreview"></div>
      </div>
      <!-- 自定义栏目 -->
      <div class="editor-field">
        <div class="field-head"><label>自定义栏目</label><span class="add-custom" id="eAddCustom">＋ 添加栏目</span></div>
        <div id="eCustomFields"></div>
        <div class="custom-tip"></div>
      </div>
    </div>
    <div class="editor-footer"><button class="save-btn" id="eSave">保存</button></div>
  </div>
</div>

<!-- AI 查词面板（编辑器子面板） -->
<div id="aiLookup" class="modal fullscreen hidden">
  <div class="editor-sheet">
    <div class="editor-head">
      <span class="editor-title">🤖 AI 查词</span>
      <button class="editor-close" id="aiLookupClose">✕</button>
    </div>
    <div class="editor-body">
      <div class="editor-field"><label>输入词语 / 成语</label><input id="aiWord" placeholder="如：沆瀣一气" autocomplete="off"></div>
      <button class="save-btn" id="btnAiLookupGo" style="margin:0 0 16px">查询 AI 解析</button>
      <div class="ai-result" id="aiResult">
        <div class="ai-result-loading hidden" id="aiLoading">正在请求 AI…</div>
        <div class="ai-result-content hidden" id="aiResultContent"></div>
        <button class="save-btn ai-save hidden" id="btnAiSave" style="background:#27ae60;margin-top:14px">⬇️ 一键保存为词条</button>
      </div>
    </div>
  </div>
</div>

<!-- 设置面板 -->
<div id="settings" class="modal hidden">
  <div class="editor-sheet">
    <div class="editor-head">
      <span class="editor-title">设置与同步</span>
      <button class="editor-close" data-close>✕</button>
    </div>
    <div class="editor-body">
      <div class="form-group"><label>每日新词数量</label><input id="sDaily" type="number" min="1" max="100" value="20"></div>
      <div class="form-group"><label>主题</label><select id="sTheme"><option value="light">浅色</option><option value="dark">深色</option></select></div>
      <div class="form-block-title">☁️ GitHub 自动同步</div>
      <div class="form-group"><label>用户名</label><input id="ghUser" placeholder="username"></div>
      <div class="form-group"><label>仓库名</label><input id="ghRepo" placeholder="repo"></div>
      <div class="form-group"><label>分支</label><input id="ghBranch" placeholder="main"></div>
      <div class="form-group"><label>Token（存本机）</label><input id="ghToken" type="password" placeholder="github_pat_..."></div>
      <div class="set-actions">
        <button class="save-btn" id="sSave">保存设置</button>
        <button class="secondary-btn" id="sPull">⬇️ 拉取仓库</button>
        <button class="secondary-btn" id="sPush">☁️ 立即同步</button>
        <button class="secondary-btn" id="sExport">导出备份</button>
      </div>
      <div style="font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px">词条存 words.json，进度存 progress.json。Token 只存本机，不进仓库。</div>
      <div class="form-block-title" style="margin-top:16px">🤖 AI 设置（学习自测 &amp; 查词）</div>
      <div class="ai-profiles" id="aiProfiles">
        <!-- 动态生成多个 API 配置 -->
      </div>
      <button class="secondary-btn" id="btnAddAiProfile" style="margin-bottom:12px;width:100%">＋ 添加 API 配置</button>
      <div class="form-group"><label>自定义查词提示词（可用 `{词语}` 占位）</label><textarea id="aiPromptTmpl" rows="3"></textarea></div>
      <div class="form-group"><label>自定义自测提示词（可用 `{词语}`/`{标准信息}`/`{用户输入}` 占位）</label><textarea id="aiSelfPromptTmpl" rows="3"></textarea></div>
      <div style="font-size:11px;color:var(--muted);line-height:1.6">API Key 只有本机，不上传仓库。提示词留空时使用内置默认（默认内容已显示在框内）。</div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js?v=63"></script>
</body>
</html>
