<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>我的生词卡</title>
<link rel="stylesheet" href="style.css?v=23">
</head>
<body>
<div id="app">
  <!-- 极简顶栏 -->
  <header class="masthead">
    <div class="masthead-inner">
      <span class="masthead-dot">·</span>
      <span class="masthead-title">我的生词卡</span>
      <button class="add-btn" id="btnAdd" title="添加生词">＋</button>
    </div>
  </header>

  <!-- 信息流容器 -->
  <main class="stream" id="stream"></main>

  <!-- 底部设置入口 -->
  <div class="foot-gear" id="footGear">· · ·</div>
</div>

<!-- pin 状态栏 -->
<div id="pinStatus" class="pin-status hidden"></div>

<!-- 卡片学习覆盖层 -->
<div id="overlay" class="overlay hidden">
  <div class="card-scene">
    <div class="card-progress">
      <span id="cardLabel">今日新词</span>
      <span class="prog-label" id="cardPosition">1 / 20</span>
    </div>
    <div class="flip-card" id="flipCard">
      <div class="flip-inner">
        <div class="flip-face front" id="cardFront"></div>
        <div class="flip-face back" id="cardBack"></div>
      </div>
    </div>
    <div class="card-hint" id="cardHint">点卡片翻转查看答案</div>
    <div class="grade-row hidden" id="gradeRow">
      <button class="grade bad" data-grade="0">很陌生</button>
      <button class="grade hard" data-grade="1">有点难</button>
      <button class="grade good" data-grade="2">记住了</button>
      <button class="grade easy" data-grade="3">很简单</button>
    </div>
  </div>
</div>

<!-- 词条编辑弹层 -->
<div id="editor" class="modal hidden">
  <div class="editor-sheet">
    <div class="editor-head">
      <span class="editor-title">记录生词</span>
      <button class="editor-close" data-close>✕</button>
    </div>
    <div class="editor-body">
      <input id="eWord" placeholder="词语 / 成语" autocomplete="off">
      <textarea id="eMeaning" rows="2" placeholder="解释"></textarea>
      <textarea id="eThinking" rows="3" placeholder="思考 / 联想（原例句栏目）"></textarea>
      <div class="image-pick" id="imagePick">
        <img id="eImagePreview" class="e-image-prev hidden" alt="preview">
        <label class="image-btn">
          <span id="imageBtnText">＋ 添加图片</span>
          <input type="file" id="eImage" accept="image/*" style="display:none">
        </label>
        <button class="image-remove hidden" id="eImageRemove">移除图片</button>
      </div>
    </div>
    <div class="editor-footer">
      <button class="save-btn" id="eSave">保存</button>
    </div>
  </div>
</div>

<!-- 设置面板 -->
<div id="settings" class="modal hidden">
  <div class="editor-sheet">
    <div class="editor-head">
      <span class="editor-title">设置与同步</span>
      <button class="editor-close" data-close>✕</button>
    </div>
    <div class="editor-body">
      <div class="form-group"><label>每日新词数量</label><input id="sDaily" type="number" min="5" max="100" value="20"></div>
      <div class="form-group"><label>主题</label>
        <select id="sTheme"><option value="light">浅色</option><option value="dark">深色</option></select>
      </div>
      <div class="form-block-title">☁️ GitHub 自动同步</div>
      <div class="form-group"><label>用户名</label><input id="ghUser" placeholder="username"></div>
      <div class="form-group"><label>仓库名</label><input id="ghRepo" placeholder="repo"></div>
      <div class="form-group"><label>分支</label><input id="ghBranch" placeholder="main"></div>
      <div class="form-group"><label>Token（存本机）</label><input id="ghToken" type="password" placeholder="github_pat_..."></div>
      <div class="set-actions">
        <button class="save-btn" id="sSave">保存设置</button>
        <button class="secondary-btn" id="sPull">⬇️ 拉取仓库</button>
        <button class="secondary-btn" id="sPush">☁️ 立即同步</button>
        <button class="secondary-btn" id="sExport">导出备份</button>
      </div>
      <div style="font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px">
        图片会传到仓库 images/ 目录。数据存 words.json(词条) + progress.json(进度)。token仅存本机，不进仓库。
      </div>
    </div>
  </div>
</div>

<!-- toast -->
<div id="toast" class="toast hidden"></div>

<script src="app.js?v=23"></script>
</body>
</html>
